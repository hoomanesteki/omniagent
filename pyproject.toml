[project]
name = "omniagent"
version = "0.1.0"
description = "AI-powered data analyst with MCP multi-agent architecture"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Your Name", email = "you@example.com" }]

dependencies = [
    # === LLM Providers ===
    "anthropic>=0.40.0,<1.0.0",
    "openai>=1.12.0,<2.0.0",
    
    # === Data Processing ===
    "duckdb>=0.10.0,<2.0.0",
    "polars>=0.20.0,<1.0.0",
    "pandas>=2.1.0,<3.0.0",
    "numpy>=1.26.0,<2.0.0",
    "pyarrow>=14.0.0,<18.0.0",
    
    # === Statistics & ML ===
    "scikit-learn>=1.4.0,<2.0.0",
    "statsmodels>=0.14.0,<1.0.0",
    "scipy>=1.12.0,<2.0.0",
    
    # === Visualization ===
    "plotly>=5.18.0,<6.0.0",
    "matplotlib>=3.8.0,<4.0.0",
    "seaborn>=0.13.0,<1.0.0",
    
    # === MCP Protocol ===
    "mcp>=1.0.0,<2.0.0",
    
    # === Web UI ===
    "streamlit>=1.32.0,<2.0.0",
    
    # === Web Backend ===
    "fastapi>=0.110.0,<1.0.0",
    "uvicorn>=0.29.0,<1.0.0",
    "httpx>=0.27.0,<1.0.0",
    
    # === Configuration & Validation ===
    "pydantic>=2.6.0,<3.0.0",
    "pydantic-settings>=2.2.0,<3.0.0",
    "python-dotenv>=1.0.0,<2.0.0",
    
    # === Logging ===
    "structlog>=24.1.0,<25.0.0",
    "rich>=13.7.0,<14.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0,<9.0.0",
    "pytest-cov>=4.1.0,<6.0.0",
    "pytest-asyncio>=0.23.0,<1.0.0",
    "ruff>=0.3.0,<1.0.0",
    "mypy>=1.8.0,<2.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true
