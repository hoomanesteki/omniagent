# ==============================================================================
# OmniAgent Conda Environment
# ==============================================================================
# Create: conda env create -f environment.yml
# Activate: conda activate omniagent
# Update: conda env update -f environment.yml --prune
# Export lock: conda list --export > conda-lock.txt
# ==============================================================================

name: omniagent
channels:
  - conda-forge
  - defaults

dependencies:
  # Python version
  - python=3.11
  
  # Core Framework
  - streamlit>=1.28.0
  
  # Data Processing
  - pandas>=2.0.0
  - numpy>=1.24.0
  
  # Visualization
  - plotly>=5.15.0
  
  # Machine Learning
  - scikit-learn>=1.3.0
  
  # Statistics
  - statsmodels>=0.14.0
  
  # Utilities
  - python-dotenv>=1.0.0
  - requests>=2.31.0
  - tabulate>=0.9.0
  
  # Pip dependencies (for packages not in conda-forge)
  - pip
  - pip:
    # No additional pip packages needed currently
    # Add any pip-only packages here if needed
