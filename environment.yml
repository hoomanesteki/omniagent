name: omniagent
channels:
  - conda-forge
  - defaults

dependencies:
  # === Python ===
  - python=3.11

  # === Core Data ===
  - pandas>=2.1
  - numpy>=1.26
  - pyarrow>=14.0

  # === Database / Analytics ===
  - duckdb>=0.10

  # === Web Backend ===
  - fastapi>=0.110
  - uvicorn>=0.29

  # === Async / HTTP (MCP compatible) ===
  - httpx>=0.27
  - anyio>=4.0

  # === ML / Statistics ===
  - scikit-learn>=1.4
  - statsmodels>=0.14

  # === Plotting ===
  - matplotlib>=3.8
  - seaborn>=0.13

  # === Config & Validation ===
  - pydantic>=2.6
  - python-dotenv>=1.0

  # === Dev & Testing ===
  - pytest>=7.4

  # === Reproducibility ===
  - conda-lock>=4.0

  # === Pip-only deps ===
  - pip
  - pip:
      # MCP SDK
      - mcp>=1.0

      # LLM Provider (optional at runtime)
      - openai>=1.12
