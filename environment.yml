# =============================================================================
# OmniAgent - Conda Environment Configuration
# =============================================================================
# 
# This environment file is designed to be:
# - Cross-platform compatible (Windows, macOS Intel/ARM, Linux)
# - Reproducible with conda-lock
# - Complete for all OmniAgent features
#
# Setup Instructions:
# -------------------
# Option 1: Direct create (simple)
#   conda env create -f environment.yml
#   conda activate omniagent
#
# Option 2: With conda-lock (recommended for teams)
#   conda-lock -f environment.yml -p osx-64 -p osx-arm64 -p linux-64 -p win-64
#   conda-lock install -n omniagent conda-lock.yml
#
# =============================================================================

name: omniagent
channels:
  - conda-forge
  - defaults

dependencies:
  # ===========================================================================
  # Python Runtime
  # ===========================================================================
  - python=3.11

  # ===========================================================================
  # Core Data Processing
  # ===========================================================================
  - pandas>=2.1,<3.0
  - polars>=0.20,<1.0          # Fast DataFrame operations
  - numpy>=1.26,<2.0
  - pyarrow>=14.0,<18.0        # Parquet support, columnar processing

  # ===========================================================================
  # Database / Analytics Engine
  # ===========================================================================
  - duckdb>=0.10,<2.0          # In-process SQL analytics

  # ===========================================================================
  # Web Backend (API Server)
  # ===========================================================================
  - fastapi>=0.110,<1.0
  - uvicorn>=0.29,<1.0         # ASGI server
  - starlette>=0.36,<1.0       # FastAPI dependency

  # ===========================================================================
  # Streamlit UI
  # ===========================================================================
  - streamlit>=1.32,<2.0       # Web UI framework

  # ===========================================================================
  # Async / HTTP (MCP compatible)
  # ===========================================================================
  - httpx>=0.27,<1.0           # Async HTTP client
  - anyio>=4.0,<5.0            # Async compatibility layer
  - websockets>=12.0,<14.0     # WebSocket support

  # ===========================================================================
  # Machine Learning / Statistics
  # ===========================================================================
  - scikit-learn>=1.4,<2.0     # ML algorithms
  - statsmodels>=0.14,<1.0     # Statistical models
  - scipy>=1.12,<2.0           # Scientific computing

  # ===========================================================================
  # Visualization
  # ===========================================================================
  - matplotlib>=3.8,<4.0       # Core plotting
  - seaborn>=0.13,<1.0         # Statistical visualization
  - plotly>=5.18,<6.0          # Interactive plots

  # ===========================================================================
  # Configuration & Validation
  # ===========================================================================
  - pydantic>=2.6,<3.0         # Data validation
  - pydantic-settings>=2.2,<3.0  # Settings management
  - python-dotenv>=1.0,<2.0    # .env file loading

  # ===========================================================================
  # Logging & Monitoring
  # ===========================================================================
  - structlog>=24.1,<25.0      # Structured logging
  - rich>=13.7,<14.0           # Beautiful terminal output

  # ===========================================================================
  # Development & Testing
  # ===========================================================================
  - pytest>=8.0,<9.0           # Testing framework
  - pytest-cov>=4.1,<6.0       # Coverage reporting
  - pytest-asyncio>=0.23,<1.0  # Async test support
  - ruff>=0.3,<1.0             # Fast linter & formatter
  - mypy>=1.8,<2.0             # Type checking

  # ===========================================================================
  # Reproducibility & Build
  # ===========================================================================
  - conda-lock>=2.5,<3.0       # Lock file generation

  # ===========================================================================
  # Pip-only Dependencies
  # ===========================================================================
  - pip>=24.0
  - pip:
      # -----------------------------------------------------------------------
      # MCP (Model Context Protocol) SDK
      # -----------------------------------------------------------------------
      - mcp>=1.0.0,<2.0.0

      # -----------------------------------------------------------------------
      # LLM Providers
      # -----------------------------------------------------------------------
      - anthropic>=0.40.0,<1.0.0   # Claude API (primary)
      - openai>=1.12.0,<2.0.0      # OpenAI API (alternative)

      # -----------------------------------------------------------------------
      # Additional Streamlit Components
      # -----------------------------------------------------------------------
      - streamlit-extras>=0.4.0,<1.0.0  # Extra Streamlit components

# =============================================================================
# Platform-specific Notes:
# =============================================================================
#
# macOS (Apple Silicon / M1/M2/M3):
#   - All packages have native ARM64 builds in conda-forge
#   - If issues occur, try: CONDA_SUBDIR=osx-arm64 conda env create -f environment.yml
#
# Windows:
#   - All packages are compatible
#   - Use Anaconda Prompt or PowerShell with conda initialized
#
# Linux:
#   - All packages are compatible
#   - For headless servers, matplotlib may need: matplotlib-base instead of matplotlib
#
# =============================================================================
