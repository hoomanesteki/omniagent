name: omniagent
channels:
  - conda-forge
  - defaults
dependencies:
  # Core
  - python=3.11
  - pandas>=2.0.0
  - numpy>=1.24.0
  
  # Visualization
  - plotly>=5.18.0
  - matplotlib>=3.7.0
  - seaborn>=0.12.0
  
  # Machine Learning
  - scikit-learn>=1.3.0
  
  # Web App
  - streamlit>=1.28.0
  
  # API calls
  - requests>=2.28.0
  
  # pip dependencies (if not available in conda)
  - pip
  - pip:
    - groq  # Optional: Groq SDK
