# ==============================================================================
# OmniAgent Docker Compose Configuration
# ==============================================================================
# Usage:
#   Start:    docker-compose up -d
#   Stop:     docker-compose down
#   Logs:     docker-compose logs -f
#   Rebuild:  docker-compose up -d --build
#
# Created by: Hooman Esteki (https://esteki.ca/)
# ==============================================================================

version: '3.8'

services:
  omniagent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: omniagent
    ports:
      - "8501:8501"
    environment:
      # Groq API key for AI features (optional)
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      # LLM Model (optional, defaults to llama-3.3-70b-versatile)
      - LLM_MODEL=${LLM_MODEL:-llama-3.3-70b-versatile}
      # Streamlit settings
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_HEADLESS=true
      - STREAMLIT_BROWSER_GATHER_USAGE_STATS=false
    volumes:
      # Persist uploaded data
      - ./data/uploads:/app/data/uploads
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

